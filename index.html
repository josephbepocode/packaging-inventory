<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#101214" />

  <a class="skip" href="#main">Skip to content</a>
  <header class="top">
    <div class="brand">

      <div>
        <h1>Packaging Inventory</h1>

  <nav class="tabs" aria-label="Sections">
    <a href="#dashboard">Dashboard</a>

    <section id="view-dashboard" data-view="dashboard" aria-labelledby="h-dashboard"></section>
    <section id="view-pos" data-view="pos" aria-labelledby="h-pos" hidden></section>
